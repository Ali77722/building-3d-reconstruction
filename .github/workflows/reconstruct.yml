name: Building 3D reconstruction

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EGL_PLATFORM: surfaceless
  PIP_NO_CACHE_DIR: "1"

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Open3D runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgomp1

      - name: Get open-source reconstruction pipeline
        run: git clone --depth 1 https://github.com/JacobGroover/Single-Image-to-3D.git pipeline

      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"

      - name: Install remaining dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Reconstruct
        working-directory: pipeline
        run: >
          python -m single_image_to_3d ../input/building.jpg
          --out ../output
          --model depth-anything-small
          --device cpu
          --max-size 768
          --near 0.5
          --far 10
          --background-quantile 0.97
          --edge-threshold 0.06
          --poisson-depth 7
          --target-triangles 80000
          --mesh-format ply
          --no-render

      - name: Upload 3D model
        uses: actions/upload-artifact@v4
        with:
          name: central-building-3d
          path: output/
          if-no-files-found: error
